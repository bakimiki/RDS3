<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEYOND THE FOG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- CURSOR ORB -->
<div id="cursor-orb"></div>

<!-- LOADING -->
<div id="loading">Loading</div>

<!-- HEADER -->
<header id="header">
  <span>BEYOND</span>
  <span>THE</span>
  <span>FOG</span>
</header>

<!-- FLOATING TEXT LAYER -->
<div id="floating-layer"></div>

<!-- HERO -->
<section id="hero">

</section>

<!-- SCROLL SECTION (populated by JS) -->
<div id="scroll-section"></div>

<!-- BOTTOM ORB -->
<div id="bottom-orb">
  <div id="bottom-orb-shape"></div>
</div>

<!-- DETAIL PANEL -->
<div id="detail-panel">
  <div id="detail-inner">
    <!-- left: ref + title + photo -->
    <div id="detail-left">
      <div id="detail-ref">REF: <span id="d-ref"></span></div>
      <div id="detail-title"></div>
      <img id="detail-photo" src="" alt="" />
    </div>
    <!-- right: meta + text blocks equally spaced -->
    <div id="detail-right">
      <div>
        <div class="detail-meta-row meta-reveal" id="meta-category"><span class="label">CATEGORY</span><span id="d-category"></span></div>
        <div class="detail-meta-row meta-reveal" id="meta-region"><span class="label">REGION</span><span id="d-region"></span></div>
        <div class="detail-meta-row meta-reveal" id="meta-classification"><span class="label">CLASSIFICATION</span><span id="d-classification"></span></div>
      </div>
      <div class="detail-text-block meta-reveal" id="meta-action">
        <h4>ACTION LOG</h4>
        <p id="d-action-log"></p>
      </div>
      <div class="detail-text-block meta-reveal" id="meta-cost">
        <h4>CONTROL COST</h4>
        <p id="d-control-cost"></p>
      </div>
    </div>
  </div>
  <button id="close-btn" onclick="closeDetail()">&lt;&lt;</button>
</div>

<!-- VERTICAL REVEAL SLIDER -->
<div id="reveal-slider-wrap">
  <div id="reveal-slider-outer">
    <input type="range" id="reveal-slider" min="0" max="100" value="0" />
  </div>
</div>

<!-- HAMBURGER TOGGLE -->
<button id="jinx-toggle" onclick="toggleJinxPanel()">Add Your Jinx &lt;&lt;</button>

<!-- JINX SIDE PANEL -->
<div id="jinx-side-panel">
  <div id="jinx-panel-header">
    <div class="panel-label">Add Your Jinx</div>
    <div class="panel-sub">Every Jinx added deepens the fog</div>
  </div>
  <div id="jinx-side-form">
    <input id="jinx-side-input" type="text" placeholder="TYPE YOUR JINX HERE" maxlength="60" />
    <button id="jinx-side-submit" onclick="addJinxFromPanel()">→</button>
  </div>
</div>



<script>
// ── CONFIG ──────────────────────────────────────────────────────────
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_OH9hvOpRMTTEIh-A3xUPJ6Y9abDny5t5xqox_0mhHKNd8x6y1b4kaZkqcRw3a50zixTMRuIsuyZ3/pub?gid=736388199&single=true&output=csv';

function getImageURL(row) {
  const id = (row.ImageID || '').trim();
  if (id) return `https://lh3.googleusercontent.com/d/${id}`;
  return `https://placehold.co/400x300/e8e8e8/888?text=${encodeURIComponent(row.Superstition || 'Image')}`;
}

// ── DATA ─────────────────────────────────────────────────────────────
let items = [];
let currentIndex = 0;

async function fetchSheet() {
  const res = await fetch(SHEET_CSV);
  const text = await res.text();
  const rows = text.trim().split('\n');
  const headers = parseCSVRow(rows[0]);
  return rows.slice(1).map(r => {
    const vals = parseCSVRow(r);
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
    return obj;
  });
}

function parseCSVRow(row) {
  const result = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

// ── BUILD SCROLL SECTION ──────────────────────────────────────────────
function buildScrollSection() {
  const section = document.getElementById('scroll-section');
  section.innerHTML = '';

  // sticky container
  const sticky = document.createElement('div');
  sticky.id = 'sticky-container';

  // featured image
  const featWrap = document.createElement('div');
  featWrap.id = 'featured-wrap';
  const featImg = document.createElement('img');
  featImg.id = 'featured-img';
  featImg.onclick = openDetail;
  if (items.length) featImg.src = getImageURL(items[0]);
  featImg.alt = '';
  featWrap.appendChild(featImg);

  // grid strip (show 4 at a time)
  const strip = document.createElement('div');
  strip.id = 'grid-strip';

  sticky.appendChild(featWrap);
  sticky.appendChild(strip);
  section.appendChild(sticky);

  // spacers: one per image
  items.forEach((_, i) => {
    const sp = document.createElement('div');
    sp.className = 'scroll-spacer';
    sp.dataset.index = i;
    section.appendChild(sp);
  });

  updateGridStrip(0);
}

function updateGridStrip(idx) {
  const strip = document.getElementById('grid-strip');
  strip.innerHTML = '';
  const count = jinxPanelOpen ? 3 : 4;
  // show 3 or 4 surrounding images
  const start = Math.max(0, idx - 1);
  const end = Math.min(items.length, start + count);
  for (let i = start; i < end; i++) {
    const div = document.createElement('div');
    div.className = 'grid-thumb' + (i === idx ? ' active' : '');
    const img = document.createElement('img');
    img.src = getImageURL(items[i]);
    img.alt = '';
    div.appendChild(img);
    strip.appendChild(div);
  }
}

// ── SCROLL HANDLER ────────────────────────────────────────────────────
function onScroll() {
  // fade out floating texts as user scrolls
  const scrollY = window.scrollY;
  const heroH = window.innerHeight;
  const fadeProgress = Math.min(1, scrollY / (heroH * 0.4));
  const layer = document.getElementById('floating-layer');
  if (layer) layer.style.opacity = String(1 - fadeProgress);

  if (!items.length) return;
  const section = document.getElementById('scroll-section');
  const rect = section.getBoundingClientRect();
  const scrolled = -rect.top;
  const totalHeight = section.offsetHeight - window.innerHeight;
  const progress = Math.max(0, Math.min(1, scrolled / totalHeight));
  const idx = Math.min(items.length - 1, Math.floor(progress * items.length));

  if (idx !== currentIndex) {
    currentIndex = idx;
    const featImg = document.getElementById('featured-img');
    featImg.style.opacity = '0';
    setTimeout(() => {
      featImg.src = getImageURL(items[idx]);
      featImg.style.opacity = '1';
    }, 180);
    updateGridStrip(idx);
  }
}

window.addEventListener('scroll', onScroll, { passive: true });

// ── DETAIL PANEL ──────────────────────────────────────────────────────
function openDetail() {
  const item = items[currentIndex];
  if (!item) return;
  document.getElementById('jinx-toggle').style.display = 'none';

  document.getElementById('d-ref').textContent = String(currentIndex + 1).padStart(3, '0');
  document.getElementById('detail-title').textContent = item.Superstition || '';
  document.getElementById('d-category').textContent = item.Category || '';
  document.getElementById('d-region').textContent = item.Region || '';
  document.getElementById('d-classification').textContent = item.Classification || '';
  document.getElementById('d-action-log').textContent = item['Action Log'] || '';
  document.getElementById('d-control-cost').textContent = item['Control Cost'] || '';
  const detailId = (item.DetailImageID || '').trim();
  document.getElementById('detail-photo').src = detailId 
    ? 'https://lh3.googleusercontent.com/d/' + detailId 
    : getImageURL(item);

  document.getElementById('detail-panel').classList.add('open');
  openRevealSlider();
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('jinx-toggle').style.display = '';
  closeRevealSlider();
}

// close on ESC
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});

// ── FLOATING TEXTS ────────────────────────────────────────────────────
const STORAGE_KEY = 'btf_jinxes';

function loadJinxes() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveJinxes(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}



function spawnFloatingText(text) {
  const layer = document.getElementById('floating-layer');
  const el = document.createElement('div');
  el.className = 'floating-text';
  el.textContent = text;

  const x = Math.random() * 70 + 2;
  const y = Math.random() * 70 + 5;
  const dur = 10 + Math.random() * 14;
  const dx1 = (Math.random() - 0.5) * 120;
  const dy1 = (Math.random() - 0.5) * 60;

  el.style.left = x + '%';
  el.style.top = y + '%';
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = -(Math.random() * dur) + 's';
  el.style.animationDirection = Math.random() > 0.5 ? 'alternate' : 'alternate-reverse';
  el.style.setProperty('--dx1', dx1 + 'px');
  el.style.setProperty('--dy1', dy1 + 'px');

  layer.appendChild(el);
}

// Parallax: floating layer scrolls up faster than page
function updateFloatingParallax() {
  const layer = document.getElementById('floating-layer');
  const scrollY = window.scrollY;
  layer.style.transform = 'translateY(-' + (scrollY * 0.5) + 'px)';
}

function initFloatingTexts() {
  const jinxes = loadJinxes();
  jinxes.forEach(t => spawnFloatingText(t));
}

// ── INIT ──────────────────────────────────────────────────────────────
async function init() {
  try {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2000));
    items = await Promise.race([fetchSheet(), timeout]);
  } catch (e) {
    console.warn('Sheet fetch failed:', e);
    items = [];
  }
  buildScrollSection();
  initFloatingTexts();

  // hide loading
  const loading = document.getElementById('loading');
  loading.classList.add('hidden');
  setTimeout(() => loading.remove(), 700);
}

init();

// ── CURSOR ORB ──────────────────────────────────────────────────────
const orb = document.getElementById('cursor-orb');

// Use document-level listener, only activate over featured-img
document.addEventListener('mousemove', (e) => {
  orb.style.left = e.clientX + 'px';
  orb.style.top = e.clientY + 'px';

  const featImg = document.getElementById('featured-img');
  if (featImg) {
    const rect = featImg.getBoundingClientRect();
    const inside = e.clientX >= rect.left && e.clientX <= rect.right
                && e.clientY >= rect.top  && e.clientY <= rect.bottom;
    orb.classList.toggle('visible', inside);
  }
});

// ── VERTICAL REVEAL SLIDER ───────────────────────────────────────────
const revealSlider = document.getElementById('reveal-slider');

const metaThresholds = [
  { id: 'meta-category',       threshold: 20 },
  { id: 'meta-region',         threshold: 40 },
  { id: 'meta-classification', threshold: 60 },
  { id: 'meta-action',         threshold: 75 },
  { id: 'meta-cost',           threshold: 90 },
];

function updateMetaReveal(val) {
  metaThresholds.forEach(({ id, threshold }) => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('visible', val >= threshold);
  });
}

revealSlider.addEventListener('input', () => {
  updateMetaReveal(Number(revealSlider.value));
});

function openRevealSlider() {
  document.getElementById('reveal-slider-wrap').classList.add('open');
  revealSlider.value = 0;
  updateMetaReveal(0);
}

function closeRevealSlider() {
  document.getElementById('reveal-slider-wrap').classList.remove('open');
  revealSlider.value = 0;
}


// ── JINX SIDE PANEL ──────────────────────────────────────────────────
let jinxPanelOpen = false;

function toggleJinxPanel() {
  jinxPanelOpen = !jinxPanelOpen;
  const toggleBtn = document.getElementById('jinx-toggle');
  toggleBtn.innerHTML = jinxPanelOpen ? '&gt;&gt;' : 'Add Your Jinx &lt;&lt;';
  document.getElementById('jinx-side-panel').classList.toggle('open', jinxPanelOpen);
  document.body.classList.toggle('jinx-open', jinxPanelOpen);

  // rebuild grid strip with 3 or 4 thumbs
  updateGridStrip(currentIndex);
}

function addJinxFromPanel() {
  const input = document.getElementById('jinx-side-input');
  const val = input.value.trim();
  if (!val) return;
  const jinxes = loadJinxes();
  jinxes.push(val);
  saveJinxes(jinxes);
  spawnFloatingText(val);
  input.value = '';
}

document.addEventListener('DOMContentLoaded', () => {
  const sideInput = document.getElementById('jinx-side-input');
  if (sideInput) {
    sideInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') addJinxFromPanel();
    });
  }
});


// ── PRINT ──────────────────────────────────────────────────────
function buildPrintSingle() {
  const item = items[currentIndex];
  if (!item) return;

  const refNum = String(currentIndex + 1).padStart(3, '0');
  const imgSrc = getImageURL(item);

  document.getElementById('print-single').innerHTML =
    '<div class="ps-bg"><img src="' + imgSrc + '" alt="" /></div>' +
    '<div class="ps-text">' +
      '<div class="ps-ref">REF: ' + refNum + '</div>' +
      '<div class="ps-title">' + (item.Superstition || '') + '</div>' +
      '<div class="ps-meta-grid">' +
        '<div class="ps-meta-label">CATEGORY</div><div class="ps-meta-value">' + (item.Category || '') + '</div>' +
        '<div class="ps-meta-label">REGION</div><div class="ps-meta-value">' + (item.Region || '') + '</div>' +
        '<div class="ps-meta-label">CLASSIFICATION</div><div class="ps-meta-value">' + (item.Classification || '') + '</div>' +
        '<div class="ps-meta-label">ACTION LOG</div><div class="ps-meta-value">' + (item['Action Log'] || '') + '</div>' +
        '<div class="ps-meta-label">CONTROL COST</div><div class="ps-meta-value">' + (item['Control Cost'] || '') + '</div>' +
      '</div>' +
    '</div>';
}

function printSite() {
  buildPrintSingle();
  setTimeout(() => window.print(), 400);
}


</script>

<!-- PRINT SINGLE (current item) -->
<div id="print-single" style="display:none"></div>
<!-- PRINT BUTTON -->
<button id="print-btn" onclick="printSite()">PRINT</button>

</body>
</html>
